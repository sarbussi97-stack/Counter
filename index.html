<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Entertainment Counter</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Main 16:9 screen */
.screen {
    width: 100vw;
    height: 56.25vw;
    max-height: 100vh;
    max-width: 177.78vh;

    background: #f3f3f3;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 2%;
}

/* Heading */
.header {
    text-align: center;
    height: 10%;
}

.header h1 {
    margin: 0;
    font-size: clamp(16px, 2.2vw, 30px);
}

.header p {
    margin: 2px 0;
    font-size: clamp(8px, 1vw, 12px);
    color: #666;
}

/* Counter area */
.counters {
    height: 65%;
    display: flex;
    gap: 2%;
}

/* Buttons */
.counter {
    flex: 1;
    border: none;
    border-radius: 18px;
    color: white;
    font-weight: bold;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-shadow: 0 5px 15px rgba(0,0,0,.25);
    transition: transform .08s;
}

.counter:active {
    transform: scale(.96);
}

/* Gyanesh Kumar */
.gyanesh-btn {
    background: #e53935;
}

/* CJP */
.cjp-btn {
    background: #1976d2;
}

/* Badi Photo Styling (Large Photos) */
.leader-img {
    width: clamp(90px, 18vw, 160px);
    height: clamp(90px, 18vw, 160px);
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    margin-bottom: 3%;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4);
}

.name {
    font-size: clamp(14px, 2vw, 24px);
}

.number {
    font-size: clamp(30px, 5vw, 65px);
    margin: 1% 0;
}

.tap {
    font-size: clamp(9px, 1.2vw, 16px);
}

/* Reset and Footer area */
.footer-area {
    height: 25%;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
}

.reset-area {
    display: flex;
    justify-content: center;
    align-items: center;
}

.reset {
    border: none;
    background: #222;
    color: white;
    padding: 8px 24px;
    border-radius: 12px;
    font-size: clamp(11px, 1.3vw, 18px);
    cursor: pointer;
}

.reset:active {
    transform: scale(.95);
}

/* Bottom Names text */
.bottom-credits {
    font-size: clamp(11px, 1.5vw, 18px);
    color: #333;
    font-weight: bold;
    text-align: center;
}

/* Portrait warning */
.rotate-message {
    display: none;
}

/* Phone portrait */
@media (orientation: portrait) {

    .screen {
        display: none;
    }

    .rotate-message {
        display: flex;
        width: 100%;
        height: 100%;
        color: white;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="rotate-message">
    📱<br><br>
    कृपया मोबाइल को Landscape में घुमाएँ ↔️
</div>

<div class="screen">

    <div class="header">
        <h1>📱 Entertainment Counter</h1>
        <p>Entertainment purpose only</p>
    </div>

    <div class="counters">

        <button class="counter gyanesh-btn" onclick="addGyanesh()">
            <!-- Gyanesh Kumar Photo -->
            <img src="image_2.png" alt="Gyanesh Kumar" class="leader-img">
            <div class="name">Gyanesh Kumar</div>
            <div class="number" id="gyanesh">0</div>
            <div class="tap">👆 TAP +1</div>
        </button>

        <button class="counter cjp-btn" onclick="addCJP()">
            <!-- CJP Photo -->
            <img src="image.png" alt="CJP" class="leader-img">
            <div class="name">CJP</div>
            <div class="number" id="cjp">0</div>
            <div class="tap">👆 TAP +1</div>
        </button>

    </div>

    <div class="footer-area">
        <div class="reset-area">
            <button class="reset" onclick="resetCounter()">
                🔄 RESET
            </button>
        </div>
        <div class="bottom-credits">
            ज्ञानेश कुमार & सीजेबी (CJP)
        </div>
    </div>

</div>

<script>

let gyaneshCount = 0;
let cjpCount = 0;

function addGyanesh() {
    gyaneshCount++;
    document.getElementById("gyanesh").innerText = gyaneshCount;
}

function addCJP() {
    cjpCount++;
    document.getElementById("cjp").innerText = cjpCount;
}

function resetCounter() {
    gyaneshCount = 0;
    cjpCount = 0;

    document.getElementById("gyanesh").innerText = "0";
    document.getElementById("cjp").innerText = "0";
}

</script>

</body>
</html>
